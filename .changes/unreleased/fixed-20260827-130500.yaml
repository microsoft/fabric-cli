kind: fixed
body: Required flags are no longer shown bracketed (as if optional) in `--help` usage
  lines, matching the convention already used in the documentation. Affects `export`,
  `bulk-export`, `import`, `deploy`, `set`, `ln`, `assign`, `unassign`, `table load`,
  `acl rm`, `acl set`, `label set`, `job run-cancel`, `job run-status`, `job run-update`
  and `job run-rm`
