kind: fixed
body: Fixed a crash when requesting an Azure-scoped token with `FAB_TOKEN` and `FAB_TOKEN_ONELAKE`
  set but `FAB_TOKEN_AZURE` missing; the CLI now raises a clear authentication error instead
  of an unhandled error that terminated interactive (REPL) sessions
