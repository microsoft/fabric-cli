# Linter to enforce semantic pull request titles (see https://www.conventionalcommits.org/)
---
name: 🔍 Semantic PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - ready_for_review

permissions: {}

jobs:
  check_pr_title:
    name: Check Pull Request Title
    runs-on: ubuntu-latest
    steps:
      - name: Run Semantic PR Validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prTitle = context.payload.pull_request.title;
            const regex = /^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\([^)]+\))?(!?): .+/;

            if (!regex.test(prTitle)) {
              core.error(
                'Invalid pull request title. Use Conventional Commits format: type(scope): subject. ' +
                'Allowed types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert. ' +
                'Scope is optional; examples: "feat(api): add endpoint" or "fix: correct validation".'
              );
              core.setFailed('Update the pull request title to match the required format.');
            }
