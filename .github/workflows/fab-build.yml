name: fab:build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'tox.toml'
      - 'requirements*.txt'
      - '.github/workflows/fab-build.yml'

permissions:
    contents: read

jobs:
  # Linting Job
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"  # Use any stable Python version for linting

      - name: Install Tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Cache Tox environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox
          key: ${{ runner.os }}-tox-lint-${{ hashFiles('**/tox.toml') }}
          restore-keys: |
            ${{ runner.os }}-tox-lint-

      - name: Run Linting
        run: tox -e lint


  # Type Checking Job
  type-check:
    name: Type Check Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"  # Use any stable Python version for type checking

      - name: Install Tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Cache Tox environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox
          key: ${{ runner.os }}-tox-type-${{ hashFiles('**/tox.toml') }}
          restore-keys: |
            ${{ runner.os }}-tox-type-

      - name: Run Type Checks
        run: tox -e type
  
  # Testing Jobs with Matrix Strategy
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tox-env: "py310"
          - python-version: "3.11"
            tox-env: "py311"
          - python-version: "3.12"
            tox-env: "py312"
          - python-version: "3.13"
            tox-env: "py313"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Cache Tox environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox
          key: ${{ runner.os }}-tox-${{ matrix.tox-env }}-${{ hashFiles('**/tox.toml') }}
          restore-keys: |
            ${{ runner.os }}-tox-${{ matrix.tox-env }}-
            ${{ runner.os }}-tox-

      - name: Run Tests
        run: tox -e ${{ matrix.tox-env }}

      # Upload the coverage report as an artifact
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html-report-${{ matrix.python-version }}
          path: coverage_html
        
  # Build Job
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs:
      - test  # Ensure all test jobs complete successfully
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build
